<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعد صناعة المحتوى</title>
  
  <!-- إعدادات الأيقونة والتثبيت كتطبيق -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مساعد المحتوى">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2097/2097276.png">

  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #00e676;
    }
    textarea {
      width: 100%;
      height: 100px;
      border-radius: 10px;
      padding: 10px;
      border: none;
      font-size: 16px;
      margin-bottom: 15px;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #000;
    }
    button {
      background-color: #00e676;
      color: #000;
      border: none;
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }
    #copyBtn {
      background-color: #2196F3;
      color: #fff;
      display: none;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background-color: #1e1e1e;
      border-radius: 10px;
      text-align: right;
      white-space: pre-line;
      line-height: 1.6;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <h1>🎬 مساعد المحتوى الذكي</h1>
  <p>اكتب الموضوع الذي تريد عمل فيديو عنه:</p>
  
  <textarea id="topicInput" placeholder="مثال: سر مهارة كريستيانو رونالدو..."></textarea>
  <br>
  <button id="btn" onclick="generateContent()">توليد الفكرة والسكريبت 🚀</button>
  <button id="copyBtn" onclick="copyResult()">نسخ النص 📋</button>

  <div id="result">النتيجة ستظهر هنا...</div>

  <script>
    async function generateContent() {
      let topic = document.getElementById('topicInput').value;
      let resultDiv = document.getElementById('result');
      let btn = document.getElementById('btn');
      let copyBtn = document.getElementById('copyBtn');

      if(!topic) {
        alert('اكتب موضوعاً أولاً!');
        return;
      }

      resultDiv.innerText = "⏳ جاري توليد الفكرة والسكريبت...";
      btn.disabled = true;
      copyBtn.style.display = "none";

      try {
        let promptText = "أنت مساعد متخصص في صناعة المحتوى. اكتب 3 أفكار فيديوهات قصيرة Shorts، وسكريبت سريع بالعامية لأفضل فكرة، مع عنوان جذّاب وهاشتاجات للموضوع التالي: " + topic;

        let response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: [{ role: "user", content: promptText }]
          })
        });

        if (!response.ok) {
          throw new Error("HTTP error " + response.status);
        }

        let data = await response.text();
        resultDiv.innerText = data;
        copyBtn.style.display = "inline-block";
      } catch (error) {
        resultDiv.innerText = "❌ حدث خطأ في الاتصال بالسيرفر. تأكد من تشغيل الصفحة في متصفح كروم.";
      } finally {
        btn.disabled = false;
      }
    }

    function copyResult() {
      let text = document.getElementById('result').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('تم نسخ السكريبت بنجاح! 📋');
      });
    }
  </script>

</body>
</html>
